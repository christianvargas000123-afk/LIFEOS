<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOS</title>
<meta name="description" content="Tu organizador personal: tareas, calendario, proyectos y objetivos, con avisos en Google Calendar.">
<meta name="theme-color" content="#ECE6DA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LifeOS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800;9..144,900&family=Figtree:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: phone-first single column · sticky header · glass sheets centered on screen · 4-tab bottom bar with floating "+" */
:root{
  --paper:#ECE6DA; --linen:#F7F3EB; --card:#FBF8F2; --sunk:#E4DCCD;
  --ink:#1F2A24; --ink2:#535E57; --ink3:#7E8279; --line:#DCD2C0; --line2:#C9BDA6;
  --forest:#2E4A3B; --navy:#2A3C5C; --claret:#7B2F35; --camel:#B48E58; --gold:#94733A;
  --ok:#4F7B5B; --warn:#9A6F1E; --bad:#9A3A3A;
  --glass:rgba(250,247,240,.72); --glass-edge:rgba(255,255,255,.8); --scrim:rgba(46,40,30,.28);
  --f-d:"Fraunces", Georgia, "Times New Roman", serif;
  --f-b:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r:20px; --tabh:64px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--paper);color:var(--ink);font:600 16px/1.42 var(--f-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid rgba(46,74,59,.4);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;font-family:var(--f-d);font-weight:800;letter-spacing:-.015em;text-wrap:balance;color:var(--ink)}
h1{font-size:30px;line-height:1.08}
h2{font-size:22px;line-height:1.15}
h3{font-size:18px;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.small{font-size:14px} .tiny{font-size:12.5px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(42% 30% at 12% 8%, rgba(79,123,91,.20), transparent 70%),
   radial-gradient(38% 28% at 92% 22%, rgba(180,142,88,.22), transparent 70%),
   radial-gradient(50% 32% at 70% 96%, rgba(42,60,92,.14), transparent 70%),
   radial-gradient(36% 26% at 4% 80%, rgba(123,47,53,.10), transparent 70%),
   var(--paper)}

.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + 44px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:12px;margin-inline:-16px;padding-inline:16px;background:rgba(236,230,218,.84);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid rgba(201,189,166,.5)}
.mark{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;background:var(--forest);color:#F3E9D2;font:900 19px/1 var(--f-d)}
.top .ttl{min-width:0;flex:1}
.top .ttl b{display:block;font:800 20px/1.1 var(--f-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:12.5px;color:var(--ink3);font-weight:700}
.gpill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.gpill.ok{color:var(--ok)} .gpill.warn{color:var(--warn)}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{transform:scale(.96)}

main{display:flex;flex-direction:column;gap:16px;padding-top:16px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(247,243,235,.88);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid rgba(201,189,166,.6)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:var(--tabh);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;border:none;background:none;border-radius:14px;color:var(--ink3);font-size:12px;font-weight:800}
.tab.on{color:var(--forest);background:rgba(46,74,59,.10)}
.tab svg{width:24px;height:24px}
.fab{position:fixed;z-index:31;right:max(16px, calc(50% - 364px));bottom:calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px));height:58px;padding:0 20px 0 16px;border-radius:20px;border:none;background:var(--forest);color:#F6EEDC;display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;box-shadow:0 10px 24px rgba(46,74,59,.35)}
.fab:active{transform:scale(.96)}
.fab svg{width:24px;height:24px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;gap:12px}
@media(min-width:620px){.grid3{grid-template-columns:repeat(2,1fr)}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-2px;padding:2px 2px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:42px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);font-weight:800;font-size:14.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip.on{background:var(--forest);border-color:var(--forest);color:#F6EEDC}
.chip:active{transform:scale(.97)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on .dot{box-shadow:0 0 0 2px #F6EEDC}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75}
.btn{min-height:50px;padding:0 20px;border-radius:15px;border:1.5px solid var(--line2);background:var(--card);font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn.pri{background:var(--forest);border-color:var(--forest);color:#F6EEDC}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#EEF1F6}
.btn.danger{color:var(--bad);border-color:rgba(154,58,58,.4)}
.btn.danger.armed{background:var(--bad);color:#FBEFEF;border-color:var(--bad)}
.btn.sm{min-height:42px;font-size:14.5px;padding:0 14px;border-radius:12px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.link{border:none;background:none;padding:0;color:var(--forest);font-weight:900;font-size:14.5px;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.seg{display:flex;background:var(--sunk);border-radius:15px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:none;background:none;border-radius:11px;font-weight:800;font-size:14.5px;color:var(--ink2);white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--card);color:var(--forest);box-shadow:0 1px 3px rgba(60,48,30,.15)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);font-size:16px;font-weight:700;outline:none;-webkit-appearance:none;appearance:none}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{border-color:var(--forest);box-shadow:0 0 0 3px rgba(46,74,59,.15)}
input::placeholder,textarea::placeholder{color:var(--ink3);font-weight:600}
.label{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.p1{background:rgba(123,47,53,.13);color:var(--claret)}
.pill.p2{background:rgba(176,130,43,.16);color:#7A5814}
.pill.ok{background:rgba(79,123,91,.15);color:var(--ok)} .pill.warn{background:rgba(176,130,43,.16);color:#7A5814} .pill.bad{background:rgba(154,58,58,.13);color:var(--bad)}
.pill.g{background:rgba(42,60,92,.12);color:var(--navy)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 9px}

.tlist{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:64px}
.task.done .tt{color:var(--ink3);text-decoration:line-through}
.chk{width:36px;height:36px;flex:0 0 36px;border-radius:50%;border:2.5px solid var(--line2);background:transparent;display:grid;place-items:center;color:transparent;padding:0}
.chk svg{width:18px;height:18px}
.chk:hover{color:var(--line2)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#F6EEDC;animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.tbody{flex:1;min-width:0;border:none;background:none;text-align:left;padding:0}
.tt{font-weight:800;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;font-size:13px;font-weight:700;color:var(--ink3)}
.tm .over{color:var(--bad);font-weight:900}
.ev{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(42,60,92,.07);border:1px dashed rgba(42,60,92,.3)}
.ev .time{font-weight:900;color:var(--navy);min-width:52px;font-size:14px}
.ev a{color:var(--navy);font-weight:800;font-size:13.5px}

.sec{display:flex;align-items:center;gap:8px;margin:6px 2px -2px;font-size:12.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.sec.bad{color:var(--bad)}
.sec .n{background:var(--sunk);border-radius:999px;padding:1px 8px;color:var(--ink2);letter-spacing:0}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:0 14px;border-radius:15px;border:1px dashed var(--line2);background:rgba(251,248,242,.6);font-weight:800;color:var(--ink2);text-align:left}

.hero{display:flex;flex-direction:column;gap:4px}
.hero h1 em{font-style:normal;color:var(--forest)}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}
.quick .btn{flex:0 0 auto}

.next{background:var(--forest);color:#F3EBD8;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 26px rgba(46,74,59,.22)}
.next .eyebrow{color:rgba(243,235,216,.7)}
.next h3{color:#FBF4E4;font-size:21px}
.next .m{font-size:13.5px;font-weight:700;color:rgba(243,235,216,.85)}
.next .acts{display:flex;gap:8px}
.next .btn{min-height:46px;font-size:15px}
.next .btn.light{background:#F6EEDC;border-color:#F6EEDC;color:var(--forest)}
.next .btn.ghost{background:transparent;border-color:rgba(243,235,216,.4);color:#F3EBD8}

.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;text-align:center}
.empty b{font:800 19px/1.2 var(--f-d)}
.empty span{color:var(--ink3);font-size:14.5px;max-width:300px}

.calnav{display:flex;align-items:center;gap:8px}
.calnav h2{flex:1;text-transform:capitalize}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calhead div{padding:9px 0;text-align:center;font-size:11.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--line)}
.cell{min-height:68px;border:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.cell:nth-child(7n){border-right:none}
.cell.out{opacity:.4}
.cell .dn{font:800 15px/1 var(--f-b);width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cell.today .dn{background:var(--forest);color:#F6EEDC}
.cell .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:44px}
.cell .dots i{width:7px;height:7px;border-radius:50%}
.cell .dots i.g{background:transparent;box-shadow:inset 0 0 0 2px var(--navy)}
.cell .dots i.late{border-radius:1px;background:var(--bad)}
.cell .lbls{display:none;width:100%;flex-direction:column;gap:3px}
.cell .lbls span{display:block;font-size:11px;font-weight:800;padding:2px 5px;border-radius:6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell:active{background:rgba(46,74,59,.07)}
@media(min-width:620px){.cell{min-height:104px;align-items:stretch}.cell .dn{align-self:flex-start}.cell .dots{display:none}.cell .lbls{display:flex}}
.week{display:flex;flex-direction:column;gap:10px}
.wday{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.wday .d{flex:0 0 46px;text-align:center}
.wday .d b{display:block;font:800 24px/1 var(--f-d)}
.wday .d span{font-size:11.5px;font-weight:900;text-transform:uppercase;color:var(--ink3);letter-spacing:.08em}
.wday.today .d b{color:var(--forest)}
.wday .items{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.wday .it{font-size:14px;font-weight:700;display:flex;gap:7px;align-items:center;min-width:0}
.wday .it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 10px;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
@media(min-width:700px){.board{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin-inline:0;padding-inline:0}}
.bcol{flex:0 0 min(84%,300px);scroll-snap-align:start;background:rgba(228,220,205,.55);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.bcol .bh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 6px;font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.bcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line2);border-radius:14px;padding:11px}
.bcard .bt{font-weight:800;font-size:15px;line-height:1.25;border:none;background:none;padding:0;text-align:left;width:100%;overflow-wrap:anywhere}
.bcard .bm{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.bcard .mv{margin-left:auto;display:flex;gap:6px}
.bcard .mv button{min-width:44px;height:36px;padding:0 8px;border-radius:10px;border:1.5px solid var(--line2);background:var(--linen);font-weight:900;font-size:12.5px}

.gwrap{background:rgba(251,248,242,.85);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gscroll{overflow-x:auto}
.ggrid{display:flex;min-width:min-content}
.glab{position:sticky;left:0;z-index:3;background:var(--card);border-right:1px solid var(--line);flex:0 0 118px;width:118px}
.glab div{height:36px;display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12.5px;font-weight:800;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glab .gh,.gtr .gh{height:30px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.gtr{position:relative;flex:0 0 auto}
.gtr .gh{display:flex;border-bottom:1px solid var(--line)}
.gtr .gh span{flex:0 0 auto;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;white-space:nowrap;overflow:hidden}
.grow{height:36px;border-bottom:1px solid var(--line);position:relative}
.gbar{position:absolute;top:8px;height:20px;border-radius:7px;font-size:11px;font-weight:800;color:#FBF6EA;padding:0 7px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;border:none}
.gms{position:absolute;top:11px;width:13px;height:13px;background:var(--gold);transform:rotate(45deg);border-radius:2px}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--claret);z-index:2;pointer-events:none}
/* Gantt en grande: ventana amplia, filas más altas, encabezado fijo al desplazar */
.glass.wide{width:min(100%,1180px);height:100%;display:flex;flex-direction:column}
.glass.wide .gwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.gwrap.big .gscroll{flex:1;min-height:0;overflow:auto}
.gwrap.big .glab{flex-basis:178px;width:178px}
.gwrap.big .glab div,.gwrap.big .grow{height:46px}
.gwrap.big .glab div{font-size:14px}
.gwrap.big .gh{position:sticky;top:0;z-index:4;background:var(--card);height:38px!important;font-size:12px}
.gwrap.big .glab .gh{z-index:5}
.gwrap.big .gbar{top:11px;height:24px;font-size:12.5px;border-radius:8px}
.gwrap.big .gms{top:16px;width:15px;height:15px}
@media(max-width:520px){.gwrap.big .glab{flex-basis:128px;width:128px}}

.okr .top2{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.okr .pct{font:900 28px/1 var(--f-d)}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.stepper{display:flex;gap:8px}
.stepper button{flex:1;min-height:46px;border-radius:13px;border:1.5px solid var(--line2);background:var(--linen);font-weight:900;font-size:15px}

.kpi{display:flex;flex-direction:column;gap:4px;text-align:left}
.kpi .v{font:900 30px/1.05 var(--f-d)}
.kpi .l{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kpi .d{font-size:13px;font-weight:700;color:var(--ink2)}
canvas.chart{width:100%;display:block}
.ins{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--warn)}
.ins b{display:block;font-weight:900;margin-bottom:3px}
details.more{border:1px solid var(--line);border-radius:16px;background:rgba(251,248,242,.6)}
details.more>summary{list-style:none;min-height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:800;cursor:pointer;color:var(--ink2)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-size:20px;font-weight:900;color:var(--ink3)}
details.more[open]>summary::after{content:"–"}
details.more>div{padding:0 14px 14px}

.layer{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);
  background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.glass{position:relative;width:min(100%,430px);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;

<script type="text/plain" id="gsTemplate">
/**
 * LifeOS · puente con Google Calendar y almacenamiento de tus datos.
 *
 * Cómo instalarlo (también aparece dentro de LifeOS → Ajustes):
 * 1. En LifeOS toca "Copiar código del script". Ese código ya trae tu clave personal.
 * 2. Abre https://script.google.com, crea un proyecto nuevo y pega el código.
 * 3. Implementar → Nueva implementación → Aplicación web.
 *    Ejecutar como: Yo. Quién tiene acceso: Cualquier usuario.
 * 4. Autoriza con tu cuenta y pega la URL de la aplicación web en LifeOS.
 *
 * Este script solo usa tu Google Calendar y su propio almacenamiento privado.
 * Sin la clave correcta no responde nada.
 */
var CLAVE = '__CLAVE__';
var ZONA = 'America/Mexico_City';

function doPost(e) {
  var req = {};
  try { req = JSON.parse((e && e.postData && e.postData.contents) || '{}'); }
  catch (err) { return out({ ok: false, code: 'bad_request', error: 'Solicitud inválida' }); }
  if (!req.key || req.key !== CLAVE) return out({ ok: false, code: 'unauthorized', error: 'La clave no coincide' });
  var fn = ACTIONS[req.action];
  if (!fn) return out({ ok: false, code: 'bad_request', error: 'Acción desconocida' });
  try {
    var res = fn(req) || {};
    res.ok = true;
    return out(res);
  } catch (err) {
    return out({ ok: false, code: 'server', error: String((err && err.message) || err) });
  }
}

function doGet() { return out({ ok: true, app: 'LifeOS' }); }

function out(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

var ACTIONS = {
  ping: function () { return { tz: ZONA, calendar: CalendarApp.getDefaultCalendar().getName() }; },
  load: function () { return readData(); },
  save: function (r) { return writeData(r); },
  events: function (r) { return { events: listEvents(r.from, r.to) }; },
  createEvent: function (r) { return createEv(r); },
  updateEvent: function (r) { return updateEv(r); },
  deleteEvent: function (r) { return deleteEv(r); }
};

/* ---------- almacenamiento: tus datos en trozos dentro de las propiedades privadas del script ---------- */
function store() { return PropertiesService.getUserProperties(); }
function meta(p) { return JSON.parse(p.getProperty('meta') || '{"n":0,"ts":0}'); }

function readData() {
  var p = store(), m = meta(p), s = '';
  for (var i = 0; i < m.n; i++) s += p.getProperty('d' + i) || '';
  return { data: s || null, ts: m.ts || 0 };
}

function writeData(r) {
  var lock = LockService.getUserLock();
  lock.waitLock(15000);
  try {
    var p = store(), m = meta(p);
    if (m.ts && m.ts > (r.base || 0) && m.ts !== r.ts) {
      var cur = readData();
      return { conflict: true, data: cur.data, ts: cur.ts };
    }
    var s = String(r.data || ''), size = 8000, n = Math.ceil(s.length / size), props = {};
    if (s.length > 450000) throw new Error('Los datos superan el límite de almacenamiento');
    for (var i = 0; i < n; i++) props['d' + i] = s.slice(i * size, (i + 1) * size);
    props.meta = JSON.stringify({ n: n, ts: r.ts });
    p.setProperties(props, false);
    for (var j = n; j < m.n; j++) p.deleteProperty('d' + j);
    return { ts: r.ts };
  } finally {
    lock.releaseLock();
  }
}

/* ---------- calendario ---------- */
function cal() { return CalendarApp.getDefaultCalendar(); }
function day(s, hm) { return Utilities.parseDate(s + ' ' + (hm || '12:00'), ZONA, 'yyyy-MM-dd HH:mm'); }

function listEvents(from, to) {
  var a = day(from, '00:00'), b = day(to, '23:59');
  return cal().getEvents(a, b).slice(0, 500).map(function (ev) {
    var all = ev.isAllDayEvent(), st = all ? ev.getAllDayStartDate() : ev.getStartTime();
    return {
      id: ev.getId(),
      title: ev.getTitle() || '(Sin título)',
      date: Utilities.formatDate(st, ZONA, 'yyyy-MM-dd'),
      time: all ? null : Utilities.formatDate(st, ZONA, 'HH:mm')
    };
  });
}

function times(r) {
  if (r.hora) {
    var st = day(r.date, r.hora);
    return { allDay: false, st: st, en: new Date(st.getTime() + Math.max(15, r.durMin || 30) * 60000) };
  }
  return { allDay: true, d: day(r.date, '12:00') };
}

function setReminders(ev, r) {
  ev.removeAllReminders();
  if (r.done) return;
  ev.addPopupReminder(r.hora ? Math.max(0, r.remindMin || 0) : 180); // sin hora: 21:00 de la noche anterior
}

function createEv(r) {
  var t = times(r), opt = { description: r.desc || '' }, ev;
  if (r.rec) {
    var rule = CalendarApp.newRecurrence();
    if (r.rec === 'daily') rule.addDailyRule(); else if (r.rec === 'weekly') rule.addWeeklyRule(); else rule.addMonthlyRule();
    ev = t.allDay ? cal().createAllDayEventSeries(r.title, t.d, rule, opt) : cal().createEventSeries(r.title, t.st, t.en, rule, opt);
  } else {
    ev = t.allDay ? cal().createAllDayEvent(r.title, t.d, opt) : cal().createEvent(r.title, t.st, t.en, opt);
  }
  setReminders(ev, r);
  return { id: ev.getId() };
}

function updateEv(r) {
  var ev = cal().getEventById(r.id);
  if (!ev) return { missing: true };
  if (r.title) ev.setTitle(r.title);
  if (r.date) {
    var t = times(r);
    if (t.allDay) ev.setAllDayDate(t.d); else ev.setTime(t.st, t.en);
  }
  setReminders(ev, r);
  return {};
}

function deleteEv(r) {
  if (r.series) {
    var s = cal().getEventSeriesById(r.id);
    if (s) s.deleteEventSeries();
    return {};
  }
  var ev = cal().getEventById(r.id);
  if (ev) ev.deleteEvent();
  return {};
}

  const L=S;
  if(L.demo&&!R.demo){S=R;S.ts=Math.max(R.ts||0,ts||0);setRemoteTs(ts);saveLocal();renderAll();return}
  if(R.demo&&!L.demo){setRemoteTs(ts);return}
  const del=Object.assign({},R.deleted||{},L.deleted||{});
  const pick=(l,r)=>((r.updatedAt||'')>(l.updatedAt||'')?r:l);
  const mg=(la,ra)=>{const m=new Map();(ra||[]).forEach(x=>m.set(x.id,x));(la||[]).forEach(x=>m.set(x.id,m.has(x.id)?pick(x,m.get(x.id)):x));return[...m.values()].filter(x=>!del[x.id])};

}

  if(dm){const nm=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];const k=nm.indexOf(dm[1].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));if(k>=0){let n=(k-T.getDay()+7)%7;if(!n)n=7;o.fecha=iso(addDays(T,n))}rm(dm[0])}
  const pl=s.match(/\ben (\d+) d[ií]as?\b/i);if(pl){o.fecha=iso(addDays(T,+pl[1]));rm(pl[0])}
  /* fechas explícitas: "6 de noviembre", "el 6 nov", "6/11" (día/mes); si ya pasó este año, se toma el siguiente */
  const MM={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,set:8,oct:9,nov:10,dic:11};
  const fx=(dd,mm)=>{let d=new Date(T.getFullYear(),mm,dd);if(d.getMonth()!==mm)return null;if(d<T)d=new Date(T.getFullYear()+1,mm,dd);return iso(d)};
  const dmn=s.match(/\b(?:(?:para )?el )?(\d{1,2})\s*(?:de\s+)?(ene(?:ro)?|feb(?:rero)?|mar(?:zo)?|abr(?:il)?|may(?:o)?|jun(?:io)?|jul(?:io)?|ago(?:sto)?|sep(?:t(?:iembre)?)?|set(?:iembre)?|oct(?:ubre)?|nov(?:iembre)?|dic(?:iembre)?)\.?\b/i);
  if(dmn){const f=fx(+dmn[1],MM[dmn[2].toLowerCase().slice(0,3)]);if(f){o.fecha=f;rm(dmn[0])}}
  else{const dsl=s.match(/\b(?:(?:para )?el )?(\d{1,2})\/(\d{1,2})\b/);if(dsl){const f=fx(+dsl[1],+dsl[2]-1);if(f){o.fecha=f;rm(dsl[0])}}}
  const hm=s.match(/\b(?:a las\s+)?(\d{1,2}):(\d{2})\b/i);
  if(hm){o.hora=`${pad(clamp(+hm[1],0,23))}:${hm[2]}`;rm(hm[0])}
  else{const ap=s.match(/\b(?:a las\s+)?(\d{1,2})\s*(am|pm)\b/i);if(ap){let h=+ap[1]%12;if(/pm/i.test(ap[2]))h+=12;o.hora=pad(h)+':00';rm(ap[0])}
    else{const al=s.match(/\ba las (\d{1,2})\b/i);if(al){o.hora=pad(clamp(+al[1],0,23))+':00';rm(al[0])}}}
  const du=s.match(/\b(\d+(?:[.,]\d+)?)\s*(h|hs|hrs?|horas?)\b/i);if(du){o.est=parseFloat(du[1].replace(',','.'));rm(du[0])}
  const mi=s.match(/\b(\d+)\s*(m|min|mins?|minutos?)\b/i);if(mi){o.est=+(mi[1]/60).toFixed(2);rm(mi[0])}
  const pr=s.match(/\bP([1-4])\b/i);if(pr){o.prioridad='P'+pr[1];rm(pr[0])}
  if(/\burgente\b/i.test(s)){o.prioridad='P1';rm(/\burgente\b/i)}
  if(/!diaria|!daily|\bcada d[ií]a\b/i.test(s)){o.rec='daily';rm(/!(diaria|daily)|\bcada d[ií]a\b/i)}
  if(/!semanal|!weekly|\bcada semana\b/i.test(s)){o.rec='weekly';rm(/!(semanal|weekly)|\bcada semana\b/i)}
  if(/!mensual|!monthly|\bcada mes\b/i.test(s)){o.rec='monthly';rm(/!(mensual|monthly)|\bcada mes\b/i)}
  const tags=[];s=s.replace(/#([\wáéíóúñ-]+)/gi,(m,g)=>{const a=S.areas.find(x=>x.nombre.toLowerCase()===g.toLowerCase());if(a)o.areaId=a.id;else tags.push(g.toLowerCase());return' '});
  if(!o.fecha){o.hora=null;o.rec=null}
  o.titulo=s.replace(/\s+/g,' ').replace(/\s+(el|para|a|de)$/i,'').trim()||text.trim();o.tags=tags;
  return o;
}

const chip=(label,on,attrs,dot)=>`<button class="chip ${on?'on':''}" ${attrs} aria-pressed="${on?'true':'false'}">${dot?`<span class="dot" style="background:${dot}"></span>`:''}${label}</button>`;

/* ══════════════ Hoy ══════════════ */
function vToday(){
  const T=today(),tI=iso(T);
  const over=pending().filter(isOverdue).sort(byUrgency);
  const todayPend=tasksOn(tI).filter(t=>!isDone(t)&&!isOverdue(t));
  const evs=gcOn(tI);
  const nd=pending().filter(t=>!t.fecha).length;
  const doneToday=live().filter(t=>isDone(t)&&t.completedAt&&iso(new Date(t.completedAt))===tI).length;
  const nowHM=`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
  const next=over.find(t=>t.prioridad==='P1')||todayPend.find(t=>t.hora&&t.hora>=nowHM)||todayPend.slice().sort(byUrgency)[0]||over[0]||null;
  const left=todayPend.length+over.length;
  let h=`${healthBanner()}${demoBanner()}
  <section class="hero"><span class="eyebrow">${DIA_L[wd(T)]} · ${T.getDate()} ${MES_L[T.getMonth()]}</span>
    <h1>${left?`Tienes <em>${left}</em> ${left===1?'pendiente':'pendientes'} para hoy`:doneToday?'Terminaste lo de hoy':'Día despejado'}</h1>
    ${doneToday?`<span class="small muted">Completaste ${doneToday} hoy.</span>`:''}</section>
  <div class="quick"><label class="sr" for="quick">Nueva tarea rápida</label><input type="text" id="quick" enterkeyhint="done" autocomplete="off" placeholder="Ej. Preparar reporte mañana 10:00"><button class="btn pri" data-a="quickAdd">Añadir</button></div>`;
  if(next){const a=areaById(next.areaId);
    h+=`<section class="next" aria-label="Lo siguiente"><span class="eyebrow">${isOverdue(next)?'Vencida · atiéndela primero':'Lo siguiente'}</span><h3>${esc(next.titulo)}</h3>
    <div class="m">${esc(a.nombre)}${next.hora?` · ${next.hora}`:''}${isOverdue(next)?` · venció ${fmtD(next.fecha)}`:''}${next.est?` · ${fmtH(next.est)}`:''}${next.prioridad==='P1'?' · Urgente':''}</div>
    <div class="acts"><button class="btn light" style="flex:1" data-a="done" data-id="${next.id}">${ic('check',18,3)} Completar</button><button class="btn ghost" data-a="task" data-id="${next.id}">Detalles</button></div></section>`}
  h+=gcBanner();
  const rest=t=>!next||t.id!==next.id;
  if(over.filter(rest).length)h+=sec('Vencidas',over.filter(rest).length,'bad')+`<div class="tlist">${over.filter(rest).map(t=>taskRow(t)).join('')}</div>`;
  if(evs.length)h+=sec('Agenda de Google',evs.length)+`<div class="tlist">${evs.map(evRow).join('')}</div>`;
  const tp=todayPend.filter(rest);
  if(tp.length)h+=sec('Hoy',tp.length)+`<div class="tlist">${tp.map(t=>taskRow(t,{date:false})).join('')}</div>`;
  if(!next&&!evs.length)h+=`<div class="card">${empty('Nada pendiente para hoy','Escribe arriba lo que quieras hacer o toca “Crear”.')}</div>`;
  const up=pending().filter(t=>t.fecha&&t.fecha>tI&&t.fecha<=iso(addDays(T,2))).length;
  h+=`<div class="stack">${up?`<button class="linkrow" data-a="goTasks" data-v="pending"><span>${up} para mañana y pasado</span>${ic('right',18,2.4)}</button>`:''}
    ${nd?`<button class="linkrow" data-a="goTasks" data-v="nodate"><span>${nd} sin fecha esperando lugar</span>${ic('right',18,2.4)}</button>`:''}</div>`;
  return h;
}

/* ══════════════ Tareas ══════════════ */
function tasksPool(){
  const q=(U.q||'').toLowerCase().trim();
  let pool=S.tasks.filter(t=>U.tf==='archived'?t.archived:!t.archived);
  if(U.area!=='all')pool=pool.filter(t=>t.areaId===U.area);
  if(q)pool=pool.filter(t=>(t.titulo+' '+(t.notas||'')+' '+(t.tags||[]).join(' ')+' '+(projById(t.proyectoId)||{}).nombre).toLowerCase().includes(q));
  return pool;
}
function vTasks(){
  const base=tasksPool();const tI=tISO();
  const cnt={pending:base.filter(t=>!isDone(t)).length,overdue:base.filter(isOverdue).length,nodate:base.filter(t=>!isDone(t)&&!t.fecha).length,done:base.filter(isDone).length};

  ${S.areas.length>1?`<div class="chips scroll" role="group" aria-label="Área">${chip('Todas las áreas',U.area==='all','data-a="area" data-v="all"')}${S.areas.map(a=>chip(esc(a.nombre),U.area===a.id,`data-a="area" data-v="${a.id}"`,a.color)).join('')}</div>`:''}
  ${U.tf==='pending'?`<div class="seg" role="group" aria-label="Vista">${[['list','Lista'],['board','Tablero']].map(([k,l])=>`<button class="${U.tv===k?'on':''}" data-a="tv" data-v="${k}" aria-pressed="${U.tv===k}">${l}</button>`).join('')}</div>`:''}`;

    const p=base.filter(t=>!isDone(t));

    const g=[['Vencidas',p.filter(isOverdue).sort(byUrgency),'bad'],['Hoy',p.filter(t=>t.fecha===tI).sort(byTime)],['Mañana',p.filter(t=>t.fecha===d1).sort(byTime)],['Próximos 7 días',p.filter(t=>t.fecha>d1&&t.fecha<=d7).sort((a,b)=>a.fecha>b.fecha?1:-1)],['Más adelante',p.filter(t=>t.fecha>d7).sort((a,b)=>a.fecha>b.fecha?1:-1)],['Sin fecha',p.filter(t=>!t.fecha).sort(byUrgency)]];
    g.forEach(([l,ls,c])=>{if(ls.length)h+=sec(l,ls.length,c||'')+`<div class="tlist">${ls.map(t=>taskRow(t,{date:!(l==='Hoy'||l==='Mañana')})).join('')}</div>`});
    return h;
  }
  if(U.tf==='overdue')list=base.filter(isOverdue).sort(byUrgency);

    for(let i=0;i<42;i++){const d=addDays(st,i),dI=iso(d);const ts=tasksOn(dI).filter(t=>!isDone(t)),ev=gcOn(dI);const late=ts.some(isOverdue);
      const dots=ts.slice(0,5).map(t=>`<i class="${isOverdue(t)?'late':''}" style="${isOverdue(t)?'':`background:${areaById(t.areaId).color}`}"></i>`).join('')+ev.slice(0,3).map(()=>'<i class="g"></i>').join('');

  }else{
    const st=startOfWeek(a);h+='<div class="week">';
    for(let i=0;i<7;i++){const d=addDays(st,i),dI=iso(d);const ts=tasksOn(dI),ev=gcOn(dI);
      h+=`<button class="wday ${dI===tI?'today':''}" data-a="day" data-d="${dI}" aria-label="${DIA_L[i]} ${d.getDate()}: ${ts.length} tareas"><div class="d"><span>${DIA[i]}</span><b>${d.getDate()}</b></div><div class="items">
      ${ev.map(e=>`<div class="it"><i class="dot" style="box-shadow:inset 0 0 0 2px var(--navy)"></i><span><b class="num">${e.time||''}</b> ${esc(e.title)}</span></div>`).join('')}
      ${ts.map(t=>`<div class="it" style="${isDone(t)?'opacity:.5;text-decoration:line-through':''}"><i class="dot" style="background:${areaById(t.areaId).color}"></i><span>${t.hora?`<b class="num">${t.hora}</b> `:''}${esc(t.titulo)}${isDone(t)?' (hecha)':''}</span></div>`).join('')}
      ${!ts.length&&!ev.length?'<span class="faint small">Libre</span>':''}</div></button>`}
    h+='</div>';
  }
  return h;
}

/* ══════════════ Plan: objetivos, proyectos, progreso ══════════════ */
/* Progreso de un objetivo = valor actual / meta (definición única y visible). Las tareas vinculadas se muestran aparte. */
function goalProgress(g){const l=S.tasks.filter(t=>(g.tasks||[]).includes(t.id)&&!t.archived);return{p:g.meta?clamp(g.actual/g.meta,0,1):0,l}}
function projProgress(p){const l=S.tasks.filter(t=>t.proyectoId===p.id&&!t.archived);return{l,p:l.length?l.filter(isDone).length/l.length:0}}
const nextStep=list=>list.filter(t=>!isDone(t)).sort((a,b)=>(a.fecha||'9999')>(b.fecha||'9999')?1:-1)[0];
function vPlan(){
  let h=`<div class="seg" role="group" aria-label="Sección">${[['goals','Objetivos'],['projects','Proyectos'],['progress','Progreso']].map(([k,l])=>`<button class="${U.planMode===k?'on':''}" data-a="pmode" data-v="${k}" aria-pressed="${U.planMode===k}">${l}</button>`).join('')}</div>`;
  if(U.planMode==='goals')return h+vGoals();
  if(U.planMode==='projects')return h+vProjects();
  return h+vProgress();
}
function vGoals(){

  return h+'<div class="grid3">'+S.goals.map(g=>{const a=areaById(g.areaId),{p,l}=goalProgress(g),pct=Math.round(p*100),dl=diffDays(today(),parseISO(g.limite));
    const step=g.meta>=50?Math.round(g.meta/20):g.meta>=10?1:g.meta>=3?.5:.1;const ns=nextStep(l);
    const stLabel=pct>=100?['ok','Logrado']:dl<0?['bad','Plazo vencido']:'';
    return`<article class="card okr stack"><div class="top2"><div style="min-width:0"><div class="row wrap" style="gap:6px;margin-bottom:6px"><span class="pill" style="background:${a.color}22;color:${a.color}">${esc(a.nombre)}</span>${stLabel?`<span class="pill ${stLabel[0]}">${stLabel[1]}</span>`:''}</div><h3>${esc(g.titulo)}</h3></div><span class="pct num" style="color:var(--forest)" aria-label="${pct} por ciento">${pct}%</span></div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%;background:var(--forest)"></i></div>
    <div class="row between small wrap"><span class="muted">Llevas <b class="num" style="color:var(--ink)">${+(+g.actual).toFixed(2)}</b> de ${g.meta} ${esc(g.unidad)}</span><span class="faint">${dl>=0?`Faltan ${dl} días`:`Venció hace ${-dl} días`}</span></div>
    ${l.length?`<div class="small muted">${l.filter(isDone).length} de ${l.length} tareas hechas${ns?` · Siguiente: <button class="link" data-a="task" data-id="${ns.id}">${esc(ns.titulo)}</button>`:''}</div>`:''}
    <div class="stepper"><button data-a="gstep" data-id="${g.id}" data-v="${-step}" aria-label="Restar ${step}">−${step}</button><button data-a="gstep" data-id="${g.id}" data-v="${step}" aria-label="Sumar ${step}">+${step}</button><button data-a="goal" data-id="${g.id}">Editar</button></div></article>`}).join('')+'</div>';

function vProjects(){
  let h=`<button class="btn pri block" data-a="openNew" data-v="project">Nuevo proyecto</button>`;
  if(!S.projects.length)return h+`<div class="card">${empty('Sin proyectos','Un proyecto agrupa varias tareas con una fecha de entrega, como “Mudanza” o “Tesis”.')}</div>`;
  return h+'<div class="grid3">'+S.projects.map(p=>{const a=areaById(p.areaId),{l,p:pr}=projProgress(p),pct=Math.round(pr*100),dl=diffDays(today(),parseISO(p.fin));const ns=nextStep(l);

    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%;background:${p.color}"></i></div>

    <div class="small muted">${ns?`Siguiente: <b style="color:var(--ink)">${esc(ns.titulo)}</b>${ns.fecha?` · ${relDay(ns.fecha)}`:''}`:l.length?'Todas las tareas están hechas.':'Aún sin tareas. Ábrelo para agregar la primera.'}</div></button>`}).join('')+'</div>';

function vProgress(){
  const T=today(),tI=iso(T),ws=iso(startOfWeek(T));
  const due=live().filter(t=>t.fecha&&t.fecha>=ws&&t.fecha<=tI);
  const dueDone=due.filter(isDone).length;
  const pct=due.length?Math.round(dueDone/due.length*100):null;
  const over=pending().filter(isOverdue).length,soon=pending().filter(t=>t.fecha&&t.fecha>tI&&t.fecha<=iso(addDays(T,7))).length;
  const anyDone=S.tasks.some(isDone);
  let h=`<div class="grid2">
   <button class="card kpi" data-a="goTasks" data-v="overdue"><span class="l">Vencidas</span><span class="v num" style="color:${over?'var(--bad)':'var(--ink)'}">${over}</span><span class="d">${over?'Toca para verlas':'Ninguna, vas al día'}</span></button>
   <button class="card kpi" data-a="goTasks" data-v="pending"><span class="l">Próximos 7 días</span><span class="v num">${soon}</span><span class="d">tareas con fecha</span></button>
  </div>
  <div class="card stack"><span class="l eyebrow">Cumplimiento de esta semana</span>
   ${pct==null?'<span class="muted small">Aún no hay tareas con fecha entre el lunes y hoy.</span>':`<div class="row between"><b class="num" style="font:900 30px/1 var(--f-d)">${pct}%</b><span class="small muted">${dueDone} de ${due.length} tareas</span></div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%;background:var(--forest)"></i></div>`}
   <span class="tiny faint">Tareas con fecha del lunes a hoy que ya marcaste como hechas.</span></div>
  <div class="card"><h3>Tareas completadas por semana</h3><div class="tiny faint" style="margin-bottom:8px">Últimas 6 semanas</div>${anyDone?'<canvas class="chart" id="cWeeks" style="height:180px" role="img" aria-label="Tareas completadas por semana"></canvas>':'<div class="muted small">Cuando completes tareas verás aquí tu ritmo semanal.</div>'}</div>`;
  const pg=[...S.goals.map(g=>({n:g.titulo,p:goalProgress(g).p,c:'var(--forest)',k:'Objetivo'})),...S.projects.map(p=>({n:p.nombre,p:projProgress(p).p,c:p.color,k:'Proyecto'}))];
  if(pg.length)h+=`<div class="card stack"><h3>Proyectos y objetivos</h3>${pg.map(x=>`<div class="stack" style="gap:6px"><div class="row between small"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="faint">${x.k} · </span>${esc(x.n)}</span><b class="num">${Math.round(x.p*100)}%</b></div><div class="bar"><i style="width:${x.p*100}%;background:${x.c}"></i></div></div>`).join('')}</div>`;
  const timed=S.tasks.filter(t=>isDone(t)&&t.est>0&&t.real>0);
  if(timed.length>=5)h+=`<details class="more"><summary>Tiempo planeado contra real</summary><div class="stack">${S.areas.map(a=>{const l=timed.filter(t=>t.areaId===a.id);if(!l.length)return'';const e=sum(l,t=>t.est),r=sum(l,t=>t.real);return`<div class="row between small"><span class="row" style="gap:8px"><i class="dot" style="background:${a.color}"></i>${esc(a.nombre)}</span><span class="num muted">${fmtH(e)} plan · ${fmtH(r)} real</span></div>`}).join('')}<span class="tiny faint">Basado en ${timed.length} tareas cerradas. Si no registras el tiempo real, se toma el planeado.</span></div></details>`;
  const sg=suggestions();
  if(sg.length)h+=`<div class="sec">Sugerencias <span class="n">${sg.length}</span></div><div class="stack">${sg.map(i=>`<div class="ins"><div style="flex:1;min-width:0"><b>${esc(i.title)}</b><div class="small muted">${esc(i.text)}</div><div class="row wrap" style="margin-top:10px"><button class="btn sm pri" data-a="sgApply" data-v="${esc(i.id)}">${esc(i.action)}</button><button class="btn sm" data-a="sgIgnore" data-v="${esc(i.id)}">Ocultar</button></div></div></div>`).join('')}</div>`;
  return h;
}

/* ══════════════ gráficas ══════════════ */
function cx(cv){const dpr=window.devicePixelRatio||1,w=cv.clientWidth||320,h=cv.clientHeight||180;cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);return{c,w,h}}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,Math.abs(h)/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawBars(cv,labels,data,color){const{c,w,h}=cx(cv);const Tp=20,B=24,ch=h-Tp-B;const max=Math.max(1,...data);const slot=w/labels.length,bw=Math.min(40,slot*.56);
  c.strokeStyle=css('--line');c.lineWidth=1;c.beginPath();c.moveTo(0,Tp+ch+.5);c.lineTo(w,Tp+ch+.5);c.stroke();
  labels.forEach((lb,i)=>{const x=slot*(i+.5),v=data[i]||0,bh=ch*v/max;c.fillStyle=i===labels.length-1?color:color+'99';if(v){rr(c,x-bw/2,Tp+ch-bh,bw,bh,5);c.fill()}
    c.fillStyle=css('--ink');c.font='800 12px Figtree, system-ui, sans-serif';c.textAlign='center';c.fillText(String(v),x,Tp+ch-bh-6);
    c.fillStyle=css('--ink3');c.font='700 11px Figtree, system-ui, sans-serif';c.fillText(lb,x,h-7)})}
function after(){requestAnimationFrame(()=>{
  const cw=$('#cWeeks');if(cw){const L=[],D=[];for(let i=5;i>=0;i--){const s=startOfWeek(addDays(today(),-7*i)),e=addDays(s,6);L.push(i?`${s.getDate()} ${MES[s.getMonth()]}`:'Esta');D.push(S.tasks.filter(t=>isDone(t)&&t.completedAt&&iso(new Date(t.completedAt))>=iso(s)&&iso(new Date(t.completedAt))<=iso(e)).length)}drawBars(cw,L,D,'#2E4A3B')}
  const g=$('#layer .gscroll');if(g&&!g.dataset.done){g.dataset.done=1;const t=$('.gtoday',g);if(t)g.scrollLeft=Math.max(0,parseFloat(t.style.left)-100)}
})}

/* ══════════════ cronograma (Gantt) dentro de un proyecto ══════════════ */
function projectGantt(p,opt={}){
  const tasks=S.tasks.filter(t=>t.proyectoId===p.id&&!t.archived&&t.fecha);
  const ms=p.milestones||[];
  const T=today();
  const rows=[{type:'p',label:'Proyecto',s:p.inicio,e:p.fin,color:p.color},...tasks.map(t=>({type:'t',id:t.id,label:t.titulo,s:t.inicio&&t.inicio<=t.fecha?t.inicio:t.fecha,e:t.fecha,color:isDone(t)?'#9AA196':areaById(t.areaId).color}))];
  const ds=[];rows.forEach(r=>{ds.push(parseISO(r.s),parseISO(r.e))});ms.forEach(m=>ds.push(parseISO(m.fecha)));ds.push(T);
  let min=new Date(Math.min(...ds)),max=new Date(Math.max(...ds));min=addDays(min,-2);max=addDays(max,3);
  const days=diffDays(min,max)+1;const Z={day:44,week:18,month:6};
  const PPD=opt.zoom&&Z[opt.zoom]?Z[opt.zoom]:clamp(Math.round((opt.big?Math.max(600,(window.innerWidth||800)-260):300)/days),5,opt.big?44:30),W=days*PPD;
  let head='',c=new Date(min),g=0;
  if(PPD<10){while(c<=max&&g++<80){const nx=new Date(c.getFullYear(),c.getMonth()+1,1);const end=nx>max?addDays(max,1):nx;head+=`<span style="width:${diffDays(c,end)*PPD}px">${MES[c.getMonth()]} ${String(c.getFullYear()).slice(2)}</span>`;c=nx}}
  else{const step=PPD>=20?1:7;while(c<=max&&g++<400){const w=Math.min(step,diffDays(c,max)+1)*PPD;head+=`<span style="width:${w}px">${step===1?(opt.big?DIA[wd(c)].slice(0,1)+' ':'')+c.getDate():c.getDate()+' '+MES[c.getMonth()]}</span>`;c=addDays(c,step)}}
  let labs='',trs='';
  rows.forEach(r=>{const x1=diffDays(min,parseISO(r.s))*PPD,x2=(diffDays(min,parseISO(r.e))+1)*PPD,w=Math.max(8,x2-x1);
    labs+=`<div>${r.type==='t'?`<i class="dot" style="background:${r.color}"></i>`:''}${esc(r.label)}</div>`;
    trs+=`<div class="grow">${r.type==='t'?`<button class="gbar" data-a="task" data-id="${r.id}" style="left:${x1}px;width:${w}px;background:${r.color}" aria-label="${esc(r.label)}: ${fmtD(r.s)} a ${fmtD(r.e)}">${w>70?esc(r.label):''}</button>`:`<span class="gbar" style="left:${x1}px;width:${w}px;background:${r.color};opacity:.5"></span>`+ms.map(m=>`<span class="gms" style="left:${diffDays(min,parseISO(m.fecha))*PPD+PPD/2-6}px" title="${esc(m.nombre)} · ${fmtD(m.fecha)}"></span>`).join('')}</div>`});
  return`<div class="gwrap ${opt.big?'big':''}"><div class="gscroll"><div class="ggrid"><div class="glab"><div class="gh">Tarea</div>${labs}</div>
    <div class="gtr" style="width:${W}px"><div class="gh">${head}</div>${trs}<div class="gtoday" style="left:${diffDays(min,T)*PPD+PPD/2}px"></div></div></div></div>
    <div class="row wrap tiny faint" style="gap:12px;padding:10px 12px"><span class="row" style="gap:6px"><i class="dot" style="background:var(--gold);border-radius:2px;transform:rotate(45deg)"></i>Hito</span><span class="row" style="gap:6px"><i class="dot" style="background:var(--claret);border-radius:1px;width:3px"></i>Hoy</span><span class="row" style="gap:6px"><i class="dot" style="background:#9AA196"></i>Hecha</span></div></div>`;
}

/* ══════════════ ventanas de vidrio ══════════════ */
let SH=null,armT=null,lastFocus=null;

const shHead=(eyebrow,title)=>`<div class="gh2"><div class="t">${eyebrow?`<span class="eyebrow">${eyebrow}</span>`:''}<h2 id="shT">${title}</h2></div><button class="x" data-a="close" aria-label="Cerrar">${ic('x',18,2.4)}</button></div>`;

function dateChips(k,cur,act='dset',extra=''){const T=today();const nm=addDays(T,(8-T.getDay())%7||7);

function healthBanner(){
  const out=[];

async function doExport(){
  const json=JSON.stringify(S,null,2);const name=`lifeos-${tISO()}.json`;
  try{const blob=new Blob([json],{type:'application/json'});
    if(navigator.canShare&&navigator.share){const f=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}

function toast(title,sub='',type='',act){
  const el=document.createElement('div');el.className='toast '+type;el.setAttribute('role','status');
  el.innerHTML=`<div class="tb">${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</div>${act?`<button>${esc(act.label)}</button>`:''}`;
  if(act)el.querySelector('button').onclick=()=>{act.fn();el.remove()};
  $('#toasts').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .2s';setTimeout(()=>el.remove(),220)},act?5500:3600);
  while($('#toasts').children.length>3)$('#toasts').firstChild.remove();
}

  if(e.key==='Enter'&&e.target.id==='msName'){e.preventDefault();const b=$('[data-a="msAdd"]');b&&b.click()}
  if(e.key==='Enter'&&SH&&SH.kind==='new'&&(e.target.dataset.bind==='titulo'||e.target.dataset.bind==='nombre')){e.preventDefault();const b=$('#layer .btn.pri[data-a^="create"]');b&&!b.disabled&&b.click()}
  if(e.key==='Escape'&&SH)closeSheet();
  if(e.key==='Tab'&&SH){const f=$$('#layer button,#layer input,#layer textarea,#layer a,#layer summary').filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(after,160)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(U.view==='today'||U.view==='tasks'))renderView()});

  try{localStorage.setItem('lifeos.probe','1');storageOK=localStorage.getItem('lifeos.probe')==='1';localStorage.removeItem('lifeos.probe')}catch(e){storageOK=false}
  saveU();
  S=loadLocal()||seed();
  render();
  if(!U.welcomed)openSheet('welcome');
  gcSetConfigured();if(API.url){gcLoad(true);pull()}
})();

if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
